<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@1,500&family=Bagel+Fat+One&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--pink:#ff4d8d;--gold:#ffc93c;--teal:#2ee6d0;--ink:#fff4e6;--bg:#000}
:root:not([data-theme="light"]){--bg:#000}
:root[data-theme="dark"]{--bg:#000}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#000}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.full{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:3;transition:opacity .7s}
.full.gone{opacity:0;pointer-events:none}
#go{position:relative;font:700 1.15rem 'DM Sans',system-ui,sans-serif;color:#fff;background:#000;border:2px solid var(--pink);border-radius:999px;padding:18px 38px;cursor:pointer;box-shadow:0 0 22px #ff4d8d88,inset 0 0 18px #ff4d8d44;animation:pulse 2s ease-in-out infinite;transition:transform .2s}
#go:hover{transform:scale(1.07)}
@keyframes pulse{50%{box-shadow:0 0 50px #ff4d8dcc,0 0 90px #ff4d8d55,inset 0 0 26px #ff4d8d88}}
#cd{font:400 clamp(6rem,30vw,14rem) 'Bagel Fat One',system-ui,sans-serif;color:var(--gold);text-shadow:0 0 40px #ffc93caa;z-index:4}
#cd span{animation:zoom .9s ease-out both}
@keyframes zoom{from{transform:scale(2.2);opacity:0}30%{opacity:1}to{transform:scale(.8);opacity:.2}}
#show{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:40px 20px 80px;text-align:center;opacity:0;visibility:hidden;transition:opacity 1s}
#show.on{opacity:1;visibility:visible}
h1{margin:.2em 0 0;font:400 clamp(4rem,21vw,8.6rem)/.95 'Great Vibes','Snell Roundhand',cursive}
h1 .w{display:block}
h1 .l{display:inline-block;opacity:0;transform:translateY(40px) scale(.6);background:linear-gradient(180deg,#fff,#ffe2a8 45%,#ff8fb8);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px #ff4d8d99)}
.on h1 .l{animation:in .7s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes in{to{opacity:1;transform:none}}
#who{font:italic 500 clamp(1.6rem,7vw,2.6rem) 'Playfair Display',Georgia,serif;color:#ffd6e7;text-shadow:0 0 26px #ff4d8d99;letter-spacing:.02em;margin:14px 0 8px;opacity:0;word-break:break-word}
.on #who{animation:in 1s 1.8s forwards}
.sub{opacity:0;margin:0 0 10px}
.on .sub{animation:in 1s 2.3s forwards;opacity:.85}
#stage{opacity:0;width:min(320px,84vw);margin:14px auto 0}
.on #stage{animation:in 1s 2.9s forwards}
svg{width:100%;height:auto;display:block;overflow:visible}
.flame{cursor:pointer;transform-box:fill-box;transform-origin:50% 100%;animation:fl .3s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px #ffc93c)}
.flame.out{animation:none;opacity:0;transition:opacity .4s}
@keyframes fl{from{transform:scale(1) rotate(-3deg)}to{transform:scale(.9,1.12) rotate(3deg)}}
#hint{min-height:1.6em;font-weight:500;margin:14px 0;opacity:0}
.on #hint,.on #blow{animation:in 1s 3.3s forwards}
button.b{font:700 1rem 'DM Sans',system-ui,sans-serif;border:0;border-radius:999px;padding:12px 24px;cursor:pointer;background:var(--gold);color:#3a2600;opacity:0}
button.b.pk{background:var(--pink);color:#fff;opacity:1}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
#reveal{display:none;margin-top:34px;text-align:left}
#reveal.show{display:block;animation:in .8s both}
.letter{background:linear-gradient(145deg,#ffffff1c,#ffffff08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#fff4e6;border:1px solid #ffffff3a;border-radius:22px;padding:30px 26px;box-shadow:0 0 70px #ff4d8d33,inset 0 0 30px #ffffff0a;font-size:1.1rem;line-height:1.8}
.letter b{font:italic 500 1.7rem 'Playfair Display',Georgia,serif;color:#ffb3cf}
.letter p{margin:.6em 0;white-space:pre-line}
.wishes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:20px 0}
.wish{background:#ffffff0d;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:18px;padding:18px;font-weight:500;line-height:1.4;border:1px solid}
.wish:nth-child(1){border-color:var(--pink);box-shadow:0 0 18px #ff4d8d55}.wish:nth-child(2){border-color:var(--teal);box-shadow:0 0 18px #2ee6d055}.wish:nth-child(3){border-color:var(--gold);box-shadow:0 0 18px #ffc93c55}
.wish em{display:block;font-style:normal;font-size:1.7rem;margin-bottom:4px}
.center{text-align:center}
details{margin-top:44px;border:1px solid #ffffff33;border-radius:16px;padding:14px 18px;text-align:left}
summary{cursor:pointer;font-weight:700}
label{display:block;margin:12px 0 4px;font-size:.9rem;opacity:.85}
input,textarea{width:100%;font:inherit;padding:10px 12px;border-radius:10px;border:2px solid transparent;background:#fff4e6;color:#2a1740}
input:focus,textarea:focus{border-color:var(--teal);outline:0}
textarea{min-height:100px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row .b{opacity:1}
.note{font-size:.85rem;opacity:.7;margin-top:8px}
body::after{content:'';position:fixed;inset:-20%;z-index:1;pointer-events:none;mix-blend-mode:screen;filter:blur(30px);background:radial-gradient(40% 35% at 20% 25%,#ff4d8d40,transparent 70%),radial-gradient(35% 40% at 80% 30%,#7b5cff40,transparent 70%),radial-gradient(40% 35% at 55% 85%,#2ee6d030,transparent 70%);animation:drift 16s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(5%,4%) scale(1.12)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>

<div class="full" id="intro"><button id="go">Click here</button></div>
<div class="full gone" id="cd" aria-live="assertive"></div>

<main id="show">
  <h1 id="title" aria-label="Happy Birthday"></h1>
  <p id="who">My dear Bhondu Aryaaa 💖</p>
  <p class="sub">Happy Birthday my dear Bhondu Aryaaa! Make a wish, then blow out the candles.</p>
  <div id="stage">
    <svg viewBox="0 0 300 260" role="img" aria-label="Birthday cake with five candles">
      <ellipse cx="150" cy="242" rx="130" ry="10" fill="#ff4d8d33"/>
      <rect x="40" y="150" width="220" height="90" rx="14" fill="#ff4d8d"/>
      <path d="M40 168c20 22 30-6 50 12s30-14 50 6 30-16 50 4 30-12 50 6 20-10 20-10v-28H40z" fill="#fff4e6"/>
      <rect x="70" y="112" width="160" height="50" rx="12" fill="#ffc93c"/>
      <path d="M70 128c14 16 24-4 40 8s24-10 40 4 26-12 40 2 26-10 40 4v-14H70z" fill="#fff4e6"/>
      <circle cx="80" cy="210" r="6" fill="#ffc93c"/><circle cx="130" cy="220" r="6" fill="#2ee6d0"/><circle cx="185" cy="208" r="6" fill="#ffc93c"/><circle cx="230" cy="220" r="6" fill="#2ee6d0"/>
      <g id="candles"></g>
    </svg>
  </div>
  <p id="hint">Tap each flame</p>
  <button id="blow" class="b">Blow them all out</button>

  <section id="reveal" aria-live="polite">
    <div class="letter"><b id="hi"></b><p id="msg"></p><p><b id="from"></b></p></div>
    <div class="wishes">
      <div class="wish"><em>🎂</em>May your day be as sweet as the biggest slice of cake.</div>
      <div class="wish"><em>🌟</em>May this year bring every good surprise you deserve.</div>
      <div class="wish"><em>🎈</em>May you laugh so hard today that your cheeks hurt.</div>
    </div>
    <div class="center"><button id="again" class="b pk">🎉 More fireworks</button></div>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const S={n:'My dear Bhondu Aryaaa 💖',f:'Your favorite person',m:`Happy Birthday my dear Bhondu Aryaaa! 🎉

Another year older, another year more wonderful. I hope today is full of cake, laughter and people who adore you, because you deserve all of it.

Thank you for being you. Here's to your best year yet!`};
function render(){$('who').textContent=S.n;$('hi').textContent='Happy Birthday, Bhondu Aryaaa!';$('msg').textContent=S.m;$('from').textContent='With love 💛';document.title='Happy Birthday Bhondu Aryaaa!'}
render();
let k=0;$('title').innerHTML='Happy Birthday!'.split(' ').map(w=>'<span class="w">'+w.split('').map(c=>`<span class="l" style="animation-delay:${(k++)*.09}s">${c}</span>`).join('')+'</span>').join('');

// canvas: stars + fireworks + confetti
const cv=$('fx'),g=cv.getContext('2d');let W,H,D=Math.min(devicePixelRatio||1,2),stars=[],P=[];
function size(){W=cv.width=innerWidth*D;H=cv.height=innerHeight*D;stars=Array.from({length:110},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.4+.3)*D,t:Math.random()*6}))}
size();addEventListener('resize',size);
const petals=Array.from({length:24},(_,i)=>({x:Math.random()*W,y:Math.random()*H,s:(5+Math.random()*8)*D,v:(.35+Math.random()*.8)*D,w:Math.random()*6,r:Math.random()*6,c:['#ff8fb8','#ffc0d9','#ffe2a8'][i%3]}));
const COL=['#ff4d8d','#ffc93c','#2ee6d0','#fff4e6','#9b7bff'];
function firework(x,y){const c=COL[Math.random()*5|0];for(let i=0;i<70;i++){const a=Math.PI*2*i/70,s=(2+Math.random()*4.5)*D;P.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c,a:1,f:1,g:.05*D})}}
function confetti(){for(let i=0;i<110;i++){const L=i%2;P.push({x:L?0:W,y:H*.8,vx:(L?1:-1)*(4+Math.random()*9)*D,vy:-(8+Math.random()*12)*D,c:COL[i%5],a:1,f:.004,g:.28*D,sq:(5+Math.random()*6)*D,r:0,vr:(Math.random()-.5)*.4})}}
function loop(t){
  g.fillStyle='rgba(0,0,0,.28)';g.fillRect(0,0,W,H);
  for(const s of stars){g.globalAlpha=.35+.35*Math.sin(t/900+s.t);g.fillStyle='#fff';g.beginPath();g.arc(s.x,s.y,s.r,0,7);g.fill()}
  for(const q of petals){q.y+=q.v;q.x+=Math.sin(q.w+t/1400)*.7*D;q.r+=.01;if(q.y>H+30){q.y=-30;q.x=Math.random()*W}g.globalAlpha=.45;g.fillStyle=q.c;g.save();g.translate(q.x,q.y);g.rotate(q.r);g.beginPath();g.ellipse(0,0,q.s,q.s*.55,0,0,7);g.fill();g.restore()}
  P=P.filter(p=>p.a>0&&p.y<H+40);
  for(const p of P){p.vy+=p.g;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.a-=p.f*(p.sq?1:.018/.018)*(p.sq?1:1)*(p.sq?1:1);
    if(!p.sq)p.a-=.012;
    g.globalAlpha=Math.max(p.a,0);g.fillStyle=p.c;
    if(p.sq){p.r+=p.vr;g.save();g.translate(p.x,p.y);g.rotate(p.r);g.fillRect(-p.sq/2,-p.sq/4,p.sq,p.sq/2);g.restore()}
    else{g.beginPath();g.arc(p.x,p.y,2*D,0,7);g.fill()}}
  g.globalAlpha=1;requestAnimationFrame(loop)}
requestAnimationFrame(loop);
let fwTimer;
function rain(ms){clearInterval(fwTimer);fwTimer=setInterval(()=>firework(W*(.15+Math.random()*.7),H*(.15+Math.random()*.4)),450);setTimeout(()=>clearInterval(fwTimer),ms)}

// music: Happy Birthday (public domain melody)
function music(){try{
  const A=new(window.AudioContext||window.webkitAudioContext)(),n=[[392,.75],[392,.25],[440,1],[392,1],[523,1],[494,2],[392,.75],[392,.25],[440,1],[392,1],[587,1],[523,2],[392,.75],[392,.25],[784,1],[659,1],[523,1],[494,1],[440,2],[698,.75],[698,.25],[659,1],[523,1],[587,1],[523,2]];
  let t=A.currentTime+.1;for(const[f,d]of n){const o=A.createOscillator(),v=A.createGain();o.type='triangle';o.frequency.value=f;v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(.18,t+.03);v.gain.exponentialRampToValueAtTime(.001,t+d*.42-.02+.3);o.connect(v).connect(A.destination);o.start(t);o.stop(t+d*.42+.4);t+=d*.42}
}catch(e){}}

// start sequence
$('go').onclick=()=>{
  $('intro').classList.add('gone');
  const cd=$('cd');cd.classList.remove('gone');
  let n=3;const step=()=>{if(n){cd.innerHTML='<span>'+n+'</span>';n--;setTimeout(step,900)}else{cd.classList.add('gone');$('show').classList.add('on');music();firework(W/2,H*.3);rain(9000)}};
  setTimeout(step,500);
};

// candles
const xs=[95,122,150,178,205];let lit=5;
$('candles').innerHTML=xs.map((x,i)=>`<g><rect x="${x-5}" y="78" width="10" height="36" rx="3" fill="${['#2ee6d0','#ff4d8d','#fff4e6','#ff4d8d','#2ee6d0'][i]}"/><g tabindex="0" role="button" aria-label="Blow out candle ${i+1}" class="flame"><ellipse cx="${x}" cy="66" rx="9" ry="14" fill="#ffc93c"/><ellipse cx="${x}" cy="70" rx="4.5" ry="8" fill="#fff4e6"/><rect x="${x-14}" y="48" width="28" height="44" fill="transparent"/></g></g>`).join('');
function out(f){if(f.classList.contains('out'))return;f.classList.add('out');lit--;$('hint').textContent=lit?lit+(lit===1?' flame':' flames')+' left…':'';if(!lit)done()}
document.querySelectorAll('.flame').forEach(f=>{f.onclick=()=>out(f);f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();out(f)}}});
$('blow').onclick=()=>document.querySelectorAll('.flame').forEach((f,i)=>setTimeout(()=>out(f),i*120));
function done(){$('hint').textContent='Your wish is on its way! 🎉';$('blow').style.display='none';$('reveal').classList.add('show');confetti();rain(5000);setTimeout(confetti,600);setTimeout(()=>$('reveal').scrollIntoView({behavior:'smooth',block:'start'}),600)}
$('again').onclick=()=>{confetti();rain(4000)};

</script>
</body>
</html>
